[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data_engineering_pyspark"
version = "1.0.0"
description = "Relatório PySpark de pedidos recusados e legítimos (FIAP)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Vitor Hugo Moreira Luiz da Silva — RM374115" },
    { name = "Vinicius Lima Baldin — RM374277" },
    { name = "Felippe Machoski de Souza — RM374591" }
]
keywords = ["pyspark", "data-engineering", "fiap", "parquet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspark>=4.2.0,<5.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.0.0",
    "ruff==0.12.9",
    "black==25.1.0",
    "build==1.3.0",
]

# O wheel contém apenas o pacote data_engineering_pyspark (sem módulos soltos no
# site-packages). O ponto de entrada é src/main.py, submetido com spark-submit --py-files.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "unit: testes unitários isolados (sem I/O de datasets reais)",
    "integration: testes de integração entre componentes",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
